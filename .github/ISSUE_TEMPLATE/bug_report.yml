name: Bug report
description: Something pi-web does not do what it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not use issues for security problems — see SECURITY.md.
        Paste logs only after redacting anything private (session paths, model names you would not
        share, tokens). pi-web logs are content-free by design, so logs should not contain prompt text.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the behaviour you saw. One paragraph is fine.
      placeholder: The sessions list stays empty even though pi has written sessions in the allowed folder.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, in order. Include the flags you used for `serve`.
      value: |
        1. npm ci
        2. ./packages/server/bin/pi-web.mjs serve --data-dir /tmp/pi-web-dev
        3. ...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Environment
  - type: input
    id: piweb-version
    attributes:
      label: pi-web version or commit
      description: git rev-parse --short HEAD in your checkout
      placeholder: b57ccc8
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: pi version
      description: pi --version (pi-web is pinned to 1.5.0 and fails closed on other versions)
      placeholder: "1.5.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: node -v (requires >= 22.19.0)
      placeholder: v24.10.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome/Chromium, Firefox, Safari, Mobile browser, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Server stdout/stderr and browser console. Redact first. Wrap in triple backticks.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks you already ran
      options:
        - label: npm run typecheck && npm run test:unit pass in my checkout
        - label: I reproduced this with a throwaway --data-dir, not my real ~/.pi-web
        - label: I searched open and closed issues for this
