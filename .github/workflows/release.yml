name: release

# Every commit updates npm.
#
#   push to main  -> publish a canary build to the `next` dist-tag (versions like
#                    0.1.1-canary.57.9f3c2ab). `latest` is untouched, so nobody
#                    installs an unreleased commit by accident.
#   push a tag    -> publish the stable version named by the tag to `latest`.
#
#     git tag v0.1.1 && git push origin v0.1.1
#
# Both paths run the same gate first (`npm run build` then `npm run package:smoke`:
# pack -> clean install -> boot -> authed probe), so a commit that does not produce a
# working artifact does not get published at all. Concurrency is serialised because npm
# versions are immutable and two parallel publishes of the same version lose.
#
# Canary versions are stamped inside the job only — nothing is committed back, so main's
# manifests stay at the last released version and canaries never collide with a future
# stable release. Every publishable manifest must carry the same version either way.
#
# Which packages: `node scripts/publish-list.mts` (every non-private workspace, in
# dependency order). Nothing in this file names a package, so a package added to the
# workspace is published automatically instead of being silently skipped here.
#
# Auth: npm Trusted Publishing (OIDC) via `--provenance`, so no npm token is stored
# in repository secrets. npm cannot create a trusted-publisher config for a package
# that does not exist yet (npm/cli#8544), so the *first* publish of each package is a
# one-time manual step — see MAINTAINERS.md. Once a package exists and the publisher is
# registered, every later publish needs no secret at all.
#
# A brand-new package under OIDC-only auth fails with a misleading `EOTP` (provenance is
# signed to the transparency log first, then the publish is refused). The Preflight step
# below detects that state up front and says so instead. Once it exists, the publisher can
# be registered without the website: `npm trust github <pkg> --repo h8ntome/piwebui
# --file release.yml --allow-publish` (npm >= 11.15, and a login or a granular token that
# does NOT bypass 2FA — bypass tokens are rejected by the trust API with 403).
#
# Escape hatch: a repo secret `NPM_TOKEN` (granular token) switches this workflow to
# token publishing — no provenance, and it can create new packages, which makes it the
# zero-touch bootstrap if you accept a stored credential. npm removes direct publish
# from 2FA-bypass tokens in January 2027.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Install pi at the validated version (the packaging gate boots the real server)
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0

      - name: Resolve what gets published
        id: pkgs
        # One source of truth for the package list; every loop below reads it, so adding a
        # package to the workspace cannot miss a step in this workflow.
        run: node scripts/publish-list.mts --gh >> "$GITHUB_OUTPUT"

      - name: Resolve release kind
        id: kind
        run: |
          set -euo pipefail
          base=$(node -p "require('./packages/shared/package.json').version")
          for p in ${{ steps.pkgs.outputs.dirs }}; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if [ "$v" != "$base" ]; then
              echo "::error::packages/$p is $v but the release base is $base; every publishable manifest must match."
              exit 1
            fi
          done
          if [ "${{ github.ref_type }}" = tag ]; then
            kind=stable; dist=latest; ver="${GITHUB_REF_NAME#v}"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          else
            # patch+1 as a prerelease: always newer than the released stable, always older
            # than that same patch promoted to stable later.
            major=${base%%.*}; rest=${base#*.}; minor=${rest%%.*}; patch=${rest##*.}
            kind=canary; dist=next
            ver="$major.$minor.$((patch + 1))-canary.$GITHUB_RUN_NUMBER.${GITHUB_SHA:0:7}"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi
          echo "kind=$kind"    >> "$GITHUB_OUTPUT"
          echo "tag=$dist"     >> "$GITHUB_OUTPUT"
          echo "version=$ver"  >> "$GITHUB_OUTPUT"
          echo "$kind build: $ver -> dist-tag $dist (manifests at $base)"

      - name: Refuse a tag that does not match the manifests
        if: steps.kind.outputs.kind == 'stable'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for p in ${{ steps.pkgs.outputs.dirs }}; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if [ "$v" != "$tag" ]; then
              echo "::error::tag v$tag does not match packages/$p/package.json version $v" >&2
              exit 1
            fi
          done
          echo "tag v$tag matches every manifest"

      - name: Stamp the canary version (CI only, never committed)
        if: steps.kind.outputs.kind == 'canary'
        run: node scripts/set-canary-version.mts "${{ steps.kind.outputs.base }}" "${{ steps.kind.outputs.version }}"

      - name: Resolve publish auth
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "::notice::Publishing with the NPM_TOKEN secret; provenance is skipped."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            v=$(npm -v)
            if [ "${v%%.*}" -lt 11 ] || { [ "${v%%.*}" -eq 11 ] && [ "$(echo "$v" | cut -d. -f2)" -lt 5 ]; }; then
              echo "::error::npm $v is too old for trusted publishing (needs >= 11.5.1); add 'npm install -g npm@latest'."
              exit 1
            fi
            echo "Publishing via OIDC trusted publishing with npm $v."
          fi

      - name: Preflight the registry state
        run: |
          set -euo pipefail
          missing=0
          for p in ${{ steps.pkgs.outputs.dirs }}; do
            name=$(node -p "require('./packages/$p/package.json').name")
            if v=$(npm view "$name" version 2>/dev/null) && [ -n "$v" ]; then
              echo "$name exists on npm at $v"
            else
              echo "$name is not on npm yet"
              missing=1
            fi
          done
          if [ "$missing" = 1 ] && [ "${{ steps.auth.outputs.mode }}" = oidc ]; then
            echo "::error::A package here has never been published and npm cannot create one via trusted publishing (the trusted-publisher setting only exists on a package that already exists). One-time bootstrap: npm run build, then npm publish -w ./packages/<p> --access public from a logged-in CLI (no --provenance locally); then register the publisher with 'npm trust github <name> --repo h8ntome/piwebui --file release.yml --allow-publish' (or the package's npm Settings page), or set the NPM_TOKEN secret and re-run. See MAINTAINERS.md."
            exit 1
          fi

      - name: Build and package gate
        timeout-minutes: 8
        run: |
          npm run check:cli
          npm run build
          npm run package:smoke

      - name: Publish (in dependency order)
        id: publish
        # OIDC path uses --provenance and the id-token permission; the token path was
        # already written into ~/.npmrc and must not ask for provenance it cannot sign.
        # A rejected publish shows up as 404-on-PUT, never 403, so translate it here.
        #
        # Exactly one refusal is tolerated, and only one kind of it: a 404-on-PUT under OIDC
        # means "no trusted publisher is registered for this package", which is the state of a
        # brand-new package (npm cannot register a publisher for a package that does not exist
        # yet, so it must be hand-published once). Aborting there would withhold a canary from
        # every package that IS ready — one un-bootstrapped package must not freeze npm updates
        # for the whole repository. So the rest publish, the name is recorded, and the last
        # step fails the run with the command that fixes it. Any other refusal aborts at once.
        run: |
          set -euo pipefail
          provenance=(--provenance)
          [ "${{ steps.auth.outputs.mode }}" = token ] && provenance=()
          blocked=""
          for p in ${{ steps.pkgs.outputs.dirs }}; do
            name=$(node -p "require('./packages/$p/package.json').name")
            echo "::group::publish packages/$p"
            if ! npm publish -w "./packages/$p" "${provenance[@]}" --access public --tag "${{ steps.kind.outputs.tag }}" > /tmp/pub.log 2>&1; then
              cat /tmp/pub.log
              if grep -q "404 Not Found - PUT" /tmp/pub.log && [ "${{ steps.auth.outputs.mode }}" = oidc ]; then
                echo "::warning::packages/$p ($name) was NOT published: npm has no trusted publisher registered for it. Register it once (npm >= 11.15, from a web login or a granular token that does NOT bypass 2FA): npm trust github $name --repo h8ntome/piwebui --file release.yml --allow-publish — or on the package's npm Settings page: Trusted Publishing -> GitHub Actions, owner h8ntome, repo piwebui, workflow name release.yml."
                blocked="${blocked:+$blocked }$name"
              elif grep -q "404 Not Found - PUT" /tmp/pub.log; then
                echo "::error::npm refused this publisher (404, not 403, by design). The NPM_TOKEN secret cannot write to $name: it must cover 'All packages' with read-and-manage rights, and cannot be limited to a per-package allowlist."
                exit 1
              elif grep -q "cannot publish over the previously published versions" /tmp/pub.log; then
                echo "::error::this version already exists on npm and versions are immutable; bump the manifests (or let the canary stamp pick a fresh run number)."
                exit 1
              else
                exit 1
              fi
            else
              cat /tmp/pub.log
            fi
            echo "::endgroup::"
          done
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "publishing complete; blocked on a missing trusted publisher: ${blocked:-none}"

      - name: Verify what a new install actually gets
        # The packaging gate proves the tree; only the registry proves the release. This is
        # the step that catches "`latest` still points at an artifact whose `bin` map predates
        # the command name", i.e. `npm i -g @piwebui/pi-web` succeeding and then reporting
        # `pi-web: command not found`. It installs the published tarball into a scratch
        # global prefix and runs `pi-web --version` from an unrelated cwd.
        timeout-minutes: 6
        run: |
          set -euo pipefail
          blocked="${{ steps.publish.outputs.blocked }}"
          npm run verify:published -- --version "${{ steps.kind.outputs.version }}" --settle 120 --all --allow-missing "$blocked"
          npm run verify:published -- --tag "${{ steps.kind.outputs.tag }}" --expect-version "${{ steps.kind.outputs.version }}" --all --allow-missing "$blocked"

      - name: Show what landed
        run: |
          set -euo pipefail
          sleep 20
          ver="${{ steps.kind.outputs.version }}"
          tag="${{ steps.kind.outputs.tag }}"
          {
            echo "## ${{ steps.kind.outputs.kind }} publish ${ver}"
            echo
            echo "| package | $tag |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for n in ${{ steps.pkgs.outputs.names }}; do
            # dist-tags.<tag>, not <tag>.version: asking for `.version` on a string answers
            # with empty output and exit 0, which printed a blank row here.
            got=$(npm view "$n" "dist-tags.$tag" 2>/dev/null || true)
            if [ -z "$got" ]; then got="not visible on $tag"; fi
            if [ "$got" = "$ver" ]; then mark=""; else mark=" (expected $ver)"; fi
            printf "%-24s %s%s\n" "$n" "$got" "$mark"
            echo "| \`$n\` | \`$got\`$mark |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Install a canary build with `npm install -g @piwebui/pi-web@next`.' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run for anything that could not be published
        # Kept last on purpose: the summary above is what tells you which packages landed, and
        # a red run with a package list and one command is the point — the gap must never be
        # quiet. Everything that could publish did publish.
        if: steps.publish.outputs.blocked != ''
        run: |
          echo "::error::Not every publishable package was published: ${{ steps.publish.outputs.blocked }} — npm refused them because no trusted publisher is registered for those packages (a package that has just been created cannot have one until it exists). Fix once per package: npm trust github <name> --repo h8ntome/piwebui --file release.yml --allow-publish. Every other package published normally; re-run this workflow after registering and the skipped package catches up."
          exit 1
