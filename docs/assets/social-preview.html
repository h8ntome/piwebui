<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#card{width:1280px;height:640px;position:relative;overflow:hidden;
  background:radial-gradient(1200px 700px at 88% -12%,#1e2430 0%,#0c1015 46%,#080a0d 100%);
  display:flex;align-items:center;padding:0 64px;gap:56px}
#card:before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0,transparent 63px,#ffffff05 63px,#ffffff05 64px,transparent 64px) repeat-x;
  background-size:64px 100%;opacity:.5}
.left{flex:1 1 auto;position:relative;z-index:2;min-width:0}
.mark{font:700 30px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#e6edf3;letter-spacing:-.5px}
.mark i{font-style:normal;color:#8b7bb8}
h1{font-size:53px;line-height:1.1;letter-spacing:-1.9px;font-weight:700;color:#f0f6fc;margin:20px 0 0}
h1 span{display:block;font-weight:400;color:#9aa7b4;font-size:41px;letter-spacing:-1.2px}
.sub{margin-top:24px;font-size:21.5px;color:#c2ccd6;max-width:560px}
.sub code{font-family:ui-monospace,Menlo,monospace;font-size:19px;color:#e6edf3;
  background:#ffffff0f;border:1px solid #ffffff1a;border-radius:5px;padding:1px 7px}
.pills{display:flex;gap:9px;margin-top:30px;flex-wrap:wrap}
.pill{font:500 15px/1 ui-monospace,Menlo,monospace;color:#a9b6c3;background:#ffffff0a;
  border:1px solid #ffffff1f;border-radius:999px;padding:9px 14px}
.pill b{color:#c9b8e8;font-weight:600}
.right{flex:0 0 450px;position:relative;z-index:2}
.win{background:#0d1117;border:1px solid #ffffff26;border-radius:11px;overflow:hidden;
  box-shadow:0 26px 60px -18px #000,inset 0 1px 0 #ffffff12;transform:rotate(-.7deg)}
.bar{height:34px;background:#161b22;border-bottom:1px solid #ffffff14;display:flex;align-items:center;padding:0 13px;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:#ffffff2b}
.url{flex:1;height:20px;border-radius:5px;background:#0d1117;border:1px solid #ffffff14;
  font:400 11.5px/20px ui-monospace,Menlo,monospace;color:#7d8590;padding:0 9px}
.shot{position:relative;overflow:hidden;width:450px;height:318px}
.shot img{position:absolute;width:1608px;height:904px;left:-578px;top:-291px;display:block}
.cap{margin-top:13px;text-align:right;font:400 13.5px/1.3 ui-monospace,Menlo,monospace;color:#6f7d8b}
.foot{position:absolute;left:64px;bottom:26px;z-index:2;font:400 14px/1 ui-monospace,Menlo,monospace;color:#5f6c79}
</style></head><body><div id="card">
  <div class="left">
    <div class="mark">pi<i>/</i>web</div>
    <h1>Browse and drive<br><span>your pi sessions</span></h1>
    <p class="sub">A local-first web UI for the <code>pi</code> coding agent. pi stays the only runtime
      and the only writer of session files — pi-web renders and relays, never executes.</p>
    <div class="pills">
      <span class="pill"><b>loopback</b> by default</span>
      <span class="pill">one-use <b>login code</b></span>
      <span class="pill">pinned to <b>pi 1.5.0</b></span>
      <span class="pill"><b>MIT</b></span>
    </div>
  </div>
  <div class="right">
    <div class="win">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="url">127.0.0.1:4319</span></div>
      <div class="shot"><img src="login-raw.png" alt="pi-web login screen"></div>
    </div>
  </div>
</div><div id="crop" style="position:absolute;top:700px;left:0"><div class="shot" style="width:900px;height:640px"><img src="login-raw.png" alt="" style="width:3170px;height:1780px;left:-1140px;top:-572px"></div></div></body></html>
